version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pokemontcg_api
    ports:
      - "8080:8080"
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - DOTNET_HOST_PATH=/usr/share/dotnet/dotnet
      - DOTNET_URLS=http://+:8080
    volumes:
      - ./PokemonTCG.API:/src/PokemonTCG.API:cached
      - ./PokemonTCG.SDK:/src/PokemonTCG.SDK:cached
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pokemontcg_client
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pokemontcg_db
    environment:
      SA_PASSWORD: "Admin2025!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - pokemontcg_data:/var/opt/mssql

volumes:
  pokemontcg_data:

